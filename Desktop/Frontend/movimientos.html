<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Movimientos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand">Control de Gastos</span>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Cuentas</a>
                <a class="nav-link active" href="movimientos.html">Movimientos</a>
            </div>
        </div>
    </nav>

    <div class="container py-3">
        <div id="alertContainer"></div>

        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="selUsuario">Usuario</label>
                        <select class="form-select" id="selUsuario">
                            <option value="">Seleccione un usuario</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="selCuenta">Cuenta</label>
                        <select class="form-select" id="selCuenta">
                            <option value="">Seleccione una cuenta</option>
                        </select>
                    </div>
                </div>
                <div class="row g-3 mt-1">
                    <div class="col-md-4">Total de ingresos: <span id="totalIngresos">0.00</span></div>
                    <div class="col-md-4">Total de gastos: <span id="totalGastos">0.00</span></div>
                    <div class="col-md-4">Saldo actual: <span id="saldoActual">0.00</span></div>
                </div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header" id="tituloForm">Registrar movimiento</div>
            <div class="card-body">
                <form id="frmMovimiento">
                    <input type="hidden" id="txtIdMovimiento">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="selTipo">Tipo</label>
                            <select class="form-select" id="selTipo">
                                <option value="">Seleccione un tipo</option>
                                <option value="INGRESO">INGRESO</option>
                                <option value="GASTO">GASTO</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="txtCategoria">Categoria</label>
                            <input type="text" class="form-control" id="txtCategoria" maxlength="80">
                        </div>
                        <div class="col-md-8">
                            <label class="form-label" for="txtDescripcion">Descripcion</label>
                            <input type="text" class="form-control" id="txtDescripcion" maxlength="300">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="numMonto">Monto</label>
                            <input type="number" step="0.01" class="form-control" id="numMonto">
                        </div>
                    </div>
                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary" id="btnGuardar">Guardar</button>
                        <button type="button" class="btn btn-secondary d-none" id="btnCancelar">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Movimientos de la cuenta</div>
            <div class="card-body">
                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label" for="selFiltroTipo">Filtrar por tipo</label>
                        <select class="form-select" id="selFiltroTipo">
                            <option value="">Todos</option>
                            <option value="INGRESO">INGRESO</option>
                            <option value="GASTO">GASTO</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="txtFiltroCategoria">Filtrar por categoria</label>
                        <input type="text" class="form-control" id="txtFiltroCategoria">
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Id</th>
                                <th>Fecha</th>
                                <th>Tipo</th>
                                <th>Categoria</th>
                                <th>Descripcion</th>
                                <th>Monto</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tbMovimientos"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/controllers/movimientosController.js"></script>
</body>
</html>
