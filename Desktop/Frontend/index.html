<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cuentas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand">Control de Gastos</span>
            <div class="navbar-nav">
                <a class="nav-link active" href="index.html">Cuentas</a>
                <a class="nav-link" href="movimientos.html">Movimientos</a>
            </div>
        </div>
    </nav>

    <div class="container py-3">
        <div id="alertContainer"></div>

        <div class="card mb-4">
            <div class="card-header" id="tituloForm">Registrar cuenta</div>
            <div class="card-body">
                <form id="frmCuenta">
                    <input type="hidden" id="txtIdCuenta">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="selUsuario">Usuario</label>
                            <select class="form-select" id="selUsuario">
                                <option value="">Seleccione un usuario</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="txtNombre">Nombre de la cuenta</label>
                            <input type="text" class="form-control" id="txtNombre" maxlength="100">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="selTipo">Tipo</label>
                            <select class="form-select" id="selTipo">
                                <option value="">Seleccione un tipo</option>
                                <option value="EFECTIVO">EFECTIVO</option>
                                <option value="BANCO">BANCO</option>
                                <option value="TARJETA">TARJETA</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="numSaldoInicial">Saldo inicial</label>
                            <input type="number" step="0.01" class="form-control" id="numSaldoInicial">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="selActiva">Estado</label>
                            <select class="form-select" id="selActiva">
                                <option value="S">Activa</option>
                                <option value="N">Inactiva</option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary" id="btnGuardar">Guardar</button>
                        <button type="button" class="btn btn-secondary d-none" id="btnCancelar">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Cuentas del usuario</div>
            <div class="card-body table-responsive">
                <table class="table table-striped align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Id</th>
                            <th>Nombre</th>
                            <th>Tipo</th>
                            <th>Saldo inicial</th>
                            <th>Saldo actual</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbCuentas"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/controllers/indexController.js"></script>
</body>
</html>
